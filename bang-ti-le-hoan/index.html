<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Đang tải bảng tỷ lệ hoàn…</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f7fb;color:#14213d}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 0,rgba(37,99,235,.12),transparent 30%),#f4f7fb}
    .card{width:min(470px,100%);background:#fff;border:1px solid #e5eaf2;border-radius:22px;box-shadow:0 20px 60px rgba(15,23,42,.10);padding:28px;text-align:center}
    .logo{width:58px;height:58px;border-radius:18px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;font-weight:950;font-size:28px}
    h1{font-size:20px;margin:0 0 8px}p{margin:0;color:#667085;line-height:1.55}.spin{width:30px;height:30px;border:3px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;margin:18px auto 0;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
    .err{display:none;margin-top:16px;padding:12px;border-radius:12px;background:#fff1f3;color:#be123c;text-align:left;white-space:pre-wrap;font-size:13px;line-height:1.45}
  </style>
</head>
<body>
  <div class="boot"><div class="card"><div class="logo">T</div><h1>Đang tải dữ liệu</h1><p>Giữ nguyên giao diện, chức năng và công thức hiện tại. Hệ thống đang khởi tạo đăng nhập Google.</p><div class="spin"></div><div id="err" class="err"></div></div></div>

  <script type="module">
    const SOURCE_VERSION = '5f21d9935c175a655b590525738b13e0b7874855';
    const UI_VERSION = '62';
    const CACHE_KEY = 'bang_ti_le_hoan_legacy_source_' + SOURCE_VERSION;
    const sources = [
      `https://cdn.jsdelivr.net/gh/tranductai00/web@${SOURCE_VERSION}/bang-ti-le-hoan/index.html`,
      `https://raw.githubusercontent.com/tranductai00/web/${SOURCE_VERSION}/bang-ti-le-hoan/index.html`
    ];

    function showError(message){
      const e=document.getElementById('err');
      if(e){e.style.display='block';e.textContent=message;}
      document.querySelector('.spin')?.remove();
    }

    async function fetchLegacy(){
      let lastError='';
      for(const url of sources){
        try{
          const r=await fetch(url,{cache:'force-cache',mode:'cors'});
          if(!r.ok) throw new Error(`HTTP ${r.status}`);
          const t=await r.text();
          if(!t.includes('<!doctype html') || !t.includes('rateBad')) throw new Error('Nguồn HTML không hợp lệ');
          try{localStorage.setItem(CACHE_KEY,t);}catch(e){}
          return t;
        }catch(e){lastError=String(e?.message||e);}
      }
      try{
        const cached=localStorage.getItem(CACHE_KEY);
        if(cached) return cached;
      }catch(e){}
      throw new Error('Không tải được mã nguồn gốc. '+lastError);
    }

    function patchGoogleAuth(html){
      // Chỉ loại bỏ module Firebase đăng nhập ẩn danh cũ. Không chạm vào công thức/xử lý Excel/UI.
      html=html.replace(/<script\s+type=["']module["'][^>]*>[\s\S]*?<\/script>/gi, block=>{
        return block.includes('signInAnonymously') && block.includes('window.firebaseCloud')
          ? '<!-- V50 GitHub Pages: legacy anonymous Firebase module removed -->'
          : block;
      });

      // Bỏ popup nhập Workspace cũ; phạm vi dữ liệu sẽ dùng Firebase UID của Google.
      html=html.replace(
        /<script\s+id=["']v44-workspace-login-autosync-js["'][^>]*>[\s\S]*?<\/script>/i,
        '<!-- V50 GitHub Pages: legacy workspace login removed -->'
      );

      if(!html.includes('google-account-sync.css')){
        html=html.replace('</head>','<link rel="stylesheet" href="./google-account-sync.css?v=49">\n</head>');
      }
      // V50 chỉ bổ sung lớp giao diện, không thay đổi dữ liệu/công thức.
      if(!html.includes('ui-v50.css')){
        html=html.replace('</head>',`<link rel="stylesheet" href="./ui-v50.css?v=${UI_VERSION}">\n</head>`);
      }
      if(!html.includes('ui-v51.css')){
        html=html.replace('</head>',`<link rel="stylesheet" href="./ui-v51.css?v=${UI_VERSION}">\n</head>`);
      }
      if(!html.includes('ui-v52.css')){
        html=html.replace('</head>',`<link rel="stylesheet" href="./ui-v52.css?v=${UI_VERSION}">\n</head>`);
      }
      if(!html.includes('ui-v53.css')){
        html=html.replace('</head>',`<link rel="stylesheet" href="./ui-v53.css?v=${UI_VERSION}">\n</head>`);
      }
      if(!html.includes('ui-v54.css')){
        html=html.replace('</head>',`<link rel="stylesheet" href="./ui-v54.css?v=${UI_VERSION}">\n</head>`);
      }
      if(!html.includes('ui-v55.css')){
        html=html.replace('</head>',`<link rel="stylesheet" href="./ui-v55.css?v=${UI_VERSION}">\n</head>`);
      }
      if(!html.includes('ui-v56.css')){
        html=html.replace('</head>',`<link rel="stylesheet" href="./ui-v56.css?v=${UI_VERSION}">\n</head>`);
      }
      if(!html.includes('ui-v57.css')){
        html=html.replace('</head>',`<link rel="stylesheet" href="./ui-v57.css?v=${UI_VERSION}">\n</head>`);
      }
      if(!html.includes('ui-v58.css')){
        html=html.replace('</head>',`<link rel="stylesheet" href="./ui-v58.css?v=${UI_VERSION}">\n</head>`);
      }
      if(!html.includes('ui-v59.css')){
        html=html.replace('</head>',`<link rel="stylesheet" href="./ui-v59.css?v=${UI_VERSION}">\n</head>`);
      }
      if(!html.includes('ui-v60.css')){
        html=html.replace('</head>',`<link rel="stylesheet" href="./ui-v60.css?v=${UI_VERSION}">\n</head>`);
      }
      if(!html.includes('ui-v61.css')){
        html=html.replace('</head>',`<link rel="stylesheet" href="./ui-v61.css?v=${UI_VERSION}">\n</head>`);
      }
      if(!html.includes('ui-v62.css')){
        html=html.replace('</head>',`<link rel="stylesheet" href="./ui-v62.css?v=${UI_VERSION}">\n</head>`);
      }
      if(!html.includes('google-account-sync.js')){
        html=html.replace('</body>','<script type="module" src="./google-account-sync.js?v=49"><\/script>\n</body>');
      }
      if(!html.includes('ui-v50.js')){
        html=html.replace('</body>',`<script src="./ui-v50.js?v=${UI_VERSION}"><\/script>\n</body>`);
      }
      if(!html.includes('ui-v61.js')){
        html=html.replace('</body>',`<script src="./ui-v61.js?v=${UI_VERSION}"><\/script>\n</body>`);
      }
      if(!html.includes('ui-v62.js')){
        html=html.replace('</body>',`<script src="./ui-v62.js?v=${UI_VERSION}"><\/script>\n</body>`);
      }
      return html;
    }

    try{
      const legacy=await fetchLegacy();
      const upgraded=patchGoogleAuth(legacy);
      document.open();
      document.write(upgraded);
      document.close();
    }catch(e){
      console.error(e);
      showError('Không thể khởi tạo trang.\n\n'+(e?.message||e)+'\n\nHãy kiểm tra kết nối Internet và thử tải lại trang.');
    }
  </script>
</body>
</html>
